openapi: 3.0.3
info:
  title: Portfolio Platform API
  version: 1.0.0
servers:
  - url: https://api.example.com
paths:
  /api/profile:
    get:
      summary: Get profile
      responses:
        "200":
          description: Profile
  /api/skills:
    get:
      summary: Get skills
      responses:
        "200":
          description: Skills list
  /api/experience:
    get:
      summary: Get experience
      responses:
        "200":
          description: Experience list
  /api/projects:
    get:
      summary: Get projects
      responses:
        "200":
          description: Projects list
  /api/github/stats:
    get:
      summary: Get GitHub stats
      responses:
        "200":
          description: GitHub stats
  /api/leetcode/stats:
    get:
      summary: Get LeetCode stats
      responses:
        "200":
          description: LeetCode stats
  /api/contact:
    post:
      summary: Create contact message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                message:
                  type: string
      responses:
        "201":
          description: Created
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: JWT token
  /api/admin/contacts:
    get:
      summary: Admin list contacts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contact list
  /api/admin/projects/{id}:
    patch:
      summary: Update project metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                featured:
                  type: boolean
                isVisible:
                  type: boolean
      responses:
        "200":
          description: Updated project
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
